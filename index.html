<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
		<title>After Lessons</title>
	</head>
	<body class="flex items-center justify-center h-[100vh]">
		<div id="container" class="flex flex-col gap-y-10 w-[80vw]">
			<h1 class="text-3xl font-bold text-blue-600 text-center">{{ message }}</h1>

			<div class="lessons-container grid grid-cols-4 space-between rounded-xl bg-yellow-200">
				<div
					v-for="lesson in lessons"
					class="lesson relative top-0 flex flex-col w-fit bg-blue-700 rounded-xl overflow-hidden transition-[top] duration-300 ease-in-out cursor-pointer hover:-top-2">
					<div class="top px-10 py-10 bg-cyan-500">
						<div class="image w-50 h-50 border rounded-sm border-black"></div>
					</div>
					<div class="bottom h-75 bg-purple-700"></div>
				</div>
			</div>
		</div>

		<script>
			const { createApp } = Vue;
			const BASE_URL = "http://localhost:3000";

			const app = createApp({
				data() {
					return { message: "Welcome to After Lessons App!", lessons: [] };
				},
				computed: {},
				methods: {
					async fetchLessons() {
						const response = await fetch(BASE_URL + "/lessons", { method: "get" });
						const fetchedLessons = await response.json();
						this.lessons = fetchedLessons.slice(0, 4);
						// console.log("Lessons:");
						// console.log(this.lessons);
					},
				},
				created() {
					this.fetchLessons();
				},
			});

			app.mount("#container");
		</script>
	</body>
</html>
