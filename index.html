<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
		<title>After Lessons</title>
	</head>
	<body class="flex items-center justify-center h-[100vh]">
		<div id="container" class="flex flex-col gap-y-10 w-[80vw]">
			<h1 class="text-3xl font-bold text-blue-600 text-center">{{ message }}</h1>

			<div class="lessons-container grid grid-cols-4 gap-4 rounded-xl bg-yellow-200">
				<div
					v-for="lesson in lessons"
					class="lesson group relative top-0 flex flex-col w-fit bg-blue-700 rounded-xl overflow-hidden transition-[top] duration-300 ease-in-out hover:-top-0">
					<div class="top bg-cyan-500 h-full">
						<figure class="image relative w-full h-full overflow-hidden before:absolute before:inset-0 before:bg-black/35 before:z-10">
							<img
								:src="lesson.image.url"
								:alt="lesson.image.alt"
								class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" />
						</figure>
					</div>
					<div class="bottom relative flex flex-col gap-4 px-5 py-5 bg-purple-700">
						<h1>{{ lesson.subject }}</h1>
						<p>{{ lesson.location }}</p>
						<p>${{ lesson.price }}</p>
						<p>{{ lesson.slots_available }} slots left</p>
						<button
							class="absolute bottom-4 right-4 px-3 py-2 border cursor-pointer rounded-lg duration-300 hover:border-sky-500 hover:bg-white hover:text-sky-500">
							<i class="fa fa-cart-plus fa-lg"></i>
						</button>
						<!-- <p>{{ lesson.price }}</p> -->
					</div>
				</div>
			</div>
		</div>

		<script>
			const { createApp } = Vue;
			const BASE_URL = "http://localhost:3000";

			const app = createApp({
				data() {
					return { message: "Welcome to After Lessons App!", lessons: [] };
				},
				computed: {},
				methods: {
					async fetchLessons() {
						const response = await fetch(BASE_URL + "/lessons", { method: "get" });
						const fetchedLessons = await response.json();
						this.lessons = [fetchedLessons[0], fetchedLessons[4], fetchedLessons[8], fetchedLessons[9]].map((lesson) => {
							// console.log("Printing lesson");
							// console.log(lesson);
							return { ...lesson, image: { ...lesson.image, url: BASE_URL + lesson.image.url } };
						});
						// console.log("Lessons:");
						// console.log(this.lessons);
					},
				},
				created() {
					this.fetchLessons();
				},
			});

			app.mount("#container");
		</script>
	</body>
</html>
