<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
		<title>After Lessons</title>
	</head>
	<body class="flex items-center justify-center h-[100vh]" id="body">
		<div id="container" class="flex flex-col gap-y-10 w-[80vw]">
			<h1 class="text-3xl font-bold text-blue-600 text-center">{{ message }}</h1>

			<div class="searchbar relative flex items-center gap-1">
				<label for="search-input" class="absolute left-5 top-1/2 -translate-y-1/2">
					<i class="fa fa-search fa-lg"></i>
				</label>
				<input
					type="text"
					name="search"
					v-model="searchQuery"
					id="search-input"
					placeholder="Search for lessons..."
					@input="submitSearch"
					class="search-input w-full h-full px-12 py-4 border-2 border-black outline-blue-600 rounded-4xl focus:outline-2" />
				<button
					class="clear-search absolute right-6 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer transition-color duration-300 hover:text-gray-500"
					@click="clearSearch">
					<i class="fa fa-times-circle fa-lg"></i>
				</button>
			</div>

			<div class="filter-section flex gap-3 justify-end">
				<div v-if="sortBy && sortBy !== 'none'" class="chosen-filter flex items-center px-4 py-2 rounded-4xl bg-blue-200">
					<button class="relative w-4 h-4 text-2xl text-blue-600 leading-[.9] cursor-pointer" @click="clearFilter">
						<span class="absolute -top-1 left-0">×</span>
					</button>
					<span class="ml-2 text-blue-600">{{ formatSortBy(sortBy) }}</span>
				</div>
				<div class="filter-container relative">
					<button id="filter-btn" class="filter relative px-4 py-2 bg-gray-200 rounded-sm cursor-pointer" @click="toggleFilterDropdown">
						<i class="fa fa-sliders"></i>
						<span class="ml-2">Filter</span>
					</button>
					<div
						id="filter-dropdown"
						class="filter-dropdown absolute top-5/4 right-0 py-4 px-4 w-4/2 rounded-3xl shadow-md/70 bg-white z-20 text-left"
						:class="{'hidden': !shouldShowFilterDropdown}">
						<h3 class="mb-4 text-xl font-semibold">Filter By:</h3>
						<ol>
							<li
								v-for="sortByOption of sortByOptions"
								class="relative px-2 py-1 rounded-lg hover:bg-gray-400/50 border-l-7 cursor-pointer"
								:class="{'border-l-blue-400': filterIsSelected(sortByOption), 'border-l-transparent': !filterIsSelected(sortByOption)}"
								@click="() => selectFilter(sortByOption)">
								{{ formatSortBy(sortByOption) }}
							</li>
						</ol>
					</div>
				</div>
				<button class="sort px-4 py-2 bg-gray-200 rounded-sm cursor-pointer" @click="changeSortDirection">
					<span class="text-sm">
						<i :class="'fa fa-sort-amount-' + sortDirection"></i>
					</span>
					<span class="ml-2">{{ sortDirection === 'asc' ? 'Ascending' : 'Descending' }}</span>
				</button>
			</div>

			<div class="lessons-container grid grid-cols-4 gap-4 rounded-xl">
				<div
					v-for="lesson in displayedLessons"
					class="lesson group relative top-0 flex flex-col w-fit rounded-xl overflow-hidden shadow-lg/30 transition-[top] duration-300 ease-in-out hover:-top-0">
					<div class="top bg-cyan-500 h-full">
						<figure class="image relative w-full h-full overflow-hidden before:absolute before:inset-0 before:bg-black/35 before:z-10">
							<img
								:src="lesson.image.url"
								:alt="lesson.image.alt"
								class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" />
						</figure>
					</div>
					<div class="bottom relative flex flex-col gap-2 px-5 py-5">
						<h1 class="text-xl font-semibold">{{ lesson.subject }}</h1>
						<p>{{ lesson.location }}</p>
						<p>${{ lesson.price }}</p>
						<p>{{ lesson.slots_available }} slots left</p>
						<button
							class="add-to-cart absolute bottom-4 right-4 px-3 py-2 border cursor-pointer rounded-lg duration-300 hover:border-blue-600 hover:bg-blue-600 hover:text-white"
							:disabled="lesson.slots_available <= 0"
							@click="addToCart(lesson)">
							<i class="fa fa-cart-plus fa-lg"></i>
						</button>
						<!-- <p>{{ lesson.price }}</p> -->
					</div>
				</div>
			</div>
		</div>

		<script>
			const { createApp } = Vue;
			const BASE_URL = "http://localhost:3000";

			const app = createApp({
				data() {
					return {
						message: "Welcome to After Lessons App!",
						lessons: [],
						displayedLessons: [],
						sortedLessons: [],
						searchedLessons: [],
						searchQuery: "",
						cart: [],
						sortDirection: "asc",
						sortBy: "none",
						sortByOptions: ["subject", "location", "price", "slot_availability"],
						shouldShowFilterDropdown: false,
					};
				},
				computed: {},
				methods: {
					async fetchLessons() {
						const response = await fetch(BASE_URL + "/lessons", { method: "get" });
						const fetchedLessons = await response.json();
						this.lessons = [fetchedLessons[0], fetchedLessons[4], fetchedLessons[8], fetchedLessons[9]].map((lesson) => {
							// console.log("Printing lesson");
							// console.log(lesson);
							return { ...lesson, image: { ...lesson.image, url: BASE_URL + lesson.image.url } };
						});
						this.displayedLessons = [...this.lessons];
						this.sortedLessons = [...this.lessons];
						this.searchedLessons = [...this.lessons];
						// console.log("Lessons:");
						// console.log(this.lessons);
					},

					submitSearch() {
						// console.log("Calling submitSearch with query param:", this.searchQuery);
						if (!this.searchQuery) {
							// this.displayedLessons = [...this.sortedLessons];
							this.searchedLessons = [...this.lessons];
							this.sortLessons();
							return;
						}

						// TODO: Transform this to a backend function
						console.log("Search query:", this.searchQuery);
						const lessons = [...this.lessons];
						// console.log("Original lessons array we're filtering from:");
						// console.log(lessons);
						const filteredLessons = lessons.filter((lesson) => {
							const existsInSubject = lesson.subject.toLowerCase().includes(this.searchQuery.toLowerCase());
							const existsInLocation = lesson.location.toLowerCase().includes(this.searchQuery.toLowerCase());
							const existsInPrice = new String(lesson.price).toLowerCase().includes(this.searchQuery.toLowerCase());
							const existsInSlotsAvailable = new String(lesson.slots_available).toLowerCase().includes(this.searchQuery.toLowerCase());

							// console.log("Testing lesson:");
							// console.log(lesson);
							// console.log(
							// 	"Exists in subject:",
							// 	existsInSubject,
							// 	"| Exists in Location:",
							// 	existsInLocation,
							// 	"| Exists in Price:",
							// 	existsInPrice,
							// 	"| Exists in SA:",
							// 	existsInSlotsAvailable,
							// );

							return existsInSubject || existsInLocation || existsInPrice || existsInSlotsAvailable;
						});
						this.searchedLessons = filteredLessons;
						this.displayedLessons = filteredLessons;
						this.sortLessons();
					},

					sortLessons() {
						// console.log("Within sort lessons method...");
						const filterOption = this.sortBy;

						if (filterOption === "none") {
							// console.log("Filter option is none...");
							this.sortedLessons = [...this.searchedLessons];
							this.displayedLessons = [...this.searchedLessons];
							// this.submitSearch();
							// console.log(this.displayedLessons);
							return;
						}

						const lessons = [...this.searchedLessons]; //so we can sort already searched lessons
						const direction = this.sortDirection; //possible values: "asc" | "desc"
						const sortedLessons = lessons.sort((lessonA, lessonB) => {
							let isLess, isGreater, isEqual;

							if (lessonA[filterOption] < lessonB[filterOption]) isLess = true;
							else if (lessonA[filterOption] > lessonB[filterOption]) isGreater = true;
							else isEqual = true;

							if (direction === "asc") {
								if (isLess) return -1;
								else if (isGreater) return 1;
								else if (isEqual) return 0;
							} else if (direction === "desc") {
								if (isLess) return 1;
								else if (isGreater) return -1;
								else if (isEqual) return 0;
							}
						});

						this.sortedLessons = sortedLessons;
						this.displayedLessons = sortedLessons;
					},

					clearSearch() {
						this.searchQuery = "";
						this.submitSearch();
					},

					clearFilter() {
						// console.log("Clearing filter");
						this.sortBy = "none";
						this.sortLessons();
					},

					changeSortDirection() {
						if (this.sortDirection === "asc") {
							this.sortDirection = "desc";
						} else if (this.sortDirection === "desc") {
							this.sortDirection = "asc";
						} else {
							throw new Error("Sort direction is currently invalid, so cannot be changed!");
						}
						this.sortLessons();
					},

					toggleFilterDropdown() {
						if (this.shouldShowFilterDropdown) this.hideFilterDropdown();
						else this.showFilterDropdown();
					},

					showFilterDropdown() {
						// console.log("Printing from showFilterDropdown...");
						this.shouldShowFilterDropdown = true;
						document.body.addEventListener("click", this.filterEventListener);
					},

					hideFilterDropdown() {
						// console.log("Printing from hideFilterDropdown...");
						this.shouldShowFilterDropdown = false;
						document.body.removeEventListener("click", this.filterEventListener);
					},

					filterEventListener(event) {
						// console.log("In filter event listener...");
						const isDescendant = (parent, child) => {
							var node = child.parentNode;
							while (node != null) {
								if (node === parent) return true;
								node = node.parentNode;
							}
							return false;
						};

						const target = event.target;
						// console.log(target);
						// console.log(target.parentNode);
						const filterBtn = document.getElementById("filter-btn");
						const filterDropdown = document.getElementById("filter-dropdown");
						// console.log(filterDropdown);
						// console.log("Filter dropdown is equal to target:", target === filterDropdown);
						// console.log("Filter dropdown has target:", isDescendant(filterDropdown, target));
						// console.log("Filter dropdown has target 2:", filterDropdown.contains(target));

						const belongsToFilterDropdown = filterDropdown === target || isDescendant(filterDropdown, target);
						const belongsToFilterButton = filterBtn === target || isDescendant(filterBtn, target);

						if (belongsToFilterButton) return;

						if (!belongsToFilterDropdown) {
							this.hideFilterDropdown();
						}
					},

					filterIsSelected(sortByOption) {
						// console.log("Sort by option:", sortByOption);
						// console.log("Sort by:", this.sortBy);
						// console.log();
						return sortByOption === this.sortBy;
					},

					selectFilter(sortByOption) {
						// console.log("Sort by option:", sortByOption);
						// console.log("Sort by:", this.sortBy);
						// console.log("Sort by option == sortby:", sortByOption === this.sortBy);
						if (sortByOption === this.sortBy) {
							this.clearFilter();
							// console.log("Sort by after clearing filter:", this.sortBy);
							return;
						}
						this.sortBy = sortByOption;
						this.sortLessons();
					},

					formatSortBy(sortBy) {
						// console.log("Sort by before:", sortBy);
						const toTitleCase = (str) => {
							return new String(str.charAt(0).toUpperCase() + str.substring(1).toLowerCase());
						};
						const sortByOption = sortBy ?? this.sortBy;
						const sortByModified = sortByOption
							.split("_")
							.map((word) => toTitleCase(word))
							.join(" ");
						// console.log("Sort by after:", sortByModified);
						return sortByModified;
					},

					addToCart(lesson) {
						this.cart.push(lesson.id);
						//TODO: Convert to a backend function and then refetch
						this.displayedLessons = this.displayedLessons.map((modifiedLesson) => {
							if (modifiedLesson.id !== lesson.id) return modifiedLesson;
							return { ...modifiedLesson, slots_available: modifiedLesson.slots_available - 1 };
						});
					},
				},
				computed: {
					// formatSortBy() {
					// 	return new String(this.sortBy.charAt(0).toUpperCase() + this.sortBy.substring(1).toLowerCase());
					// },
				},
				created() {
					this.fetchLessons();
				},
			});

			app.mount("#container");
		</script>
	</body>
</html>
