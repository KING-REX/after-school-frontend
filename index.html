<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
		<title>After Lessons</title>
	</head>
	<body class="flex items-center justify-center h-[100vh]">
		<div id="container">
			<h1 class="text-3xl font-bold text-blue-600">{{ message }}</h1>

			<div class="lessons-container grid grid-cols-4 gap-4 rounded-xl bg-yellow-200">
				<div
					v-for="i in 4"
					class="lesson relative top-0 flex flex-col rounded-xl overflow-hidden bg-blue-700 transition-[top] duration-300 ease-in-out cursor-pointer hover:-top-2">
					<div class="top px-10 py-10 bg-cyan-500">
						<div class="image w-50 h-50 border rounded-sm border-black"></div>
					</div>
					<div class="bottom h-75 bg-purple-700"></div>
				</div>
			</div>
		</div>

		<script>
			const { createApp } = Vue;

			const app = createApp({
				data: () => {
					return { message: "Welcome to After Lessons App!", lessons: [0, 1, 2, 3, 4, 5, 6, 7] };
				},
			});

			app.mount("#container");
		</script>
	</body>
</html>
